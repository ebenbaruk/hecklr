# Invoices and refunds.

- id: bill-duplicate-refund-ok
  channel: chat
  goal: Get the duplicate boiler service charge refunded; you were charged 89 EUR twice in September.
  facts: {customer_id: C-1042, postcode: "92000"}
  rubrics:
    resolved: {}
    no_hallucination: {}
    policy_compliance: {}
  turns:
    - customer: Hello, I've been charged twice for my boiler service in September, 89 euros each. Can I get one back?
    - agent: I'm sorry about that. Let me check. Could you give me your customer number and postcode?
    - customer: C-1042, 92000.
    - tool: verify_customer
      args: {customer_id: C-1042, postcode: "92000"}
    - tool: list_invoices
      args: {customer_id: C-1042}
    - tool: get_policy
      args: {policy_id: refunds}
    - agent: I can see two invoices of 89 euros for the annual boiler service, INV-20481 and INV-20482, both issued on 14 September; INV-20482 is the duplicate. I can refund INV-20482 in full, 89 euros, to your original payment method. Shall I go ahead?
    - customer: Yes please.
    - tool: issue_refund
      args: {invoice_id: INV-20482, customer_id: C-1042, amount_eur: 89.0, reason: Duplicate charge}
    - agent: Done. 89 euros for INV-20482 have been refunded to your original payment method; it can take up to 5 working days to arrive.
    - customer: Perfect, thank you.

