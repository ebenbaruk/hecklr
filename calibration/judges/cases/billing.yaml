- id: bill-acme-cancelled-refund
  channel: email
  subject: Charged for a visit you cancelled
  goal: Get the 49 EUR call-out charge refunded; Acme cancelled the visit.
  facts: {customer_id: C-1533, postcode: "75013", email: mei.chen@example.com}
  rubrics:
    resolved: {}
    no_hallucination: {}
    policy_compliance: {}
  turns:
    - customer: |-
        Hello,

        You charged me 49 euros for a call-out on 9 October, but your technician cancelled that visit. Please refund it.
        Customer C-1533, postcode 75013.

        Mei Chen
    - tool: verify_customer
      args: {customer_id: C-1533, postcode: "75013"}
    - tool: list_invoices
      args: {customer_id: C-1533}
    - tool: get_policy
      args: {policy_id: refunds}
    - agent: |-
        Dear Ms Chen,

        You're right, and I'm sorry: invoice INV-20615 (call-out, 49 euros) relates to a visit we cancelled, so it qualifies for a full refund. Shall I refund the 49 euros to your original payment method? Please reply to confirm.

        Kind regards,
        Acme Maintenance
    - customer: Yes please.
    - tool: issue_refund
      args: {invoice_id: INV-20615, customer_id: C-1533, amount_eur: 49.0, reason: Visit cancelled by Acme}
    - agent: |-
        Dear Ms Chen,

        The refund of 49 euros for INV-20615 has been issued to your original payment method. It should arrive within 5 working days.

        Kind regards,
        Acme Maintenance

