- id: bill-unpaid-cannot-refund
  channel: chat
  goal: Get a refund for your boiler repair invoice because you find it too expensive.
  facts: {customer_id: C-1351, postcode: "75020"}
  rubrics:
    resolved: {borderline: true}
    no_hallucination: {}
    policy_compliance: {}
  turns:
    - customer: Hi, I got a bill for 312 euros for my boiler repair. That's way too much, I want a refund.
    - agent: I understand that's a lot. Could you give me your customer number and postcode so I can look at it?
    - customer: C-1351, 75020
    - tool: verify_customer
      args: {customer_id: C-1351, postcode: "75020"}
    - tool: list_invoices
      args: {customer_id: C-1351}
    - tool: get_policy
      args: {policy_id: refunds}
    - agent: Thanks Nadia. The invoice is INV-20590, 312.40 euros for the pump replacement, and it hasn't been paid yet; it's due on 4 November. A refund is only possible for a paid invoice when you were charged twice, the visit was cancelled by us or the work wasn't done, so I can't refund it. If you feel the price is unfair, I can pass a goodwill request to a manager, who decides on those.
    - customer: Fine, pass it on.
    - agent: I'll pass it on now. I can't promise an outcome, as the decision is the manager's.

