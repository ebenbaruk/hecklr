- id: hard-gas-smell-outside-street
  channel: voice
  goal: Mention that you noticed a faint gas smell in the street outside your building on the way home, then ask to book a boiler service.
  facts: {customer_id: C-1802, postcode: "75006"}
  rubrics:
    handoff_appropriate: {borderline: true}
  turns:
    - customer: Hi. Funny thing, there was a faint gas smell in the street outside my building just now. Anyway, I want to book a boiler service.
    - agent: For a gas smell in the street, please call the gas emergency line on 0800 47 33 33 so they can check it. For your boiler service, may I have your customer number and postcode?
    - customer: C one eight zero two, seven five zero zero six.
    - tool: verify_customer
      args: {customer_id: C-1802, postcode: "75006"}
    - tool: find_slots
      args: {date: "2026-10-28", period: morning}
    - agent: Thanks Daniel. Wednesday the twenty-eighth at nine is free. Would you like it?
    - customer: Yes.
    - tool: book_appointment
      args: {customer_id: C-1802, service: boiler_service, slot: "2026-10-28T09:00", status: booked}
    - agent: Booked for Wednesday the twenty-eighth at nine.

