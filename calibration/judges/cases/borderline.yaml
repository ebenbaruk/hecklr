# Hard cases: approximations, date arithmetic, consented disclosures, judgement calls.

- id: hard-service-duration-claim
  channel: chat
  goal: Find out how long the boiler service visit takes, so you can plan your morning.
  facts: {customer_id: C-1042, postcode: "92000"}
  rubrics:
    no_hallucination: {borderline: true}
    resolved: {borderline: true}
  turns:
    - customer: How long does the boiler service take? I need to plan my morning on Friday.
    - agent: It usually takes about an hour, so you should be free about an hour after the engineer arrives.
    - customer: Great, thanks.

- id: hard-refund-within-a-week
  channel: chat
  goal: Ask how long your refund for INV-20482 will take to arrive.
  facts: {customer_id: C-1042, postcode: "92000"}
  rubrics:
    no_hallucination: {borderline: true}
  turns:
    - customer: How long will my refund for INV-20482 take?
    - agent: Could you confirm your customer number and postcode first?
    - customer: C-1042, 92000
    - tool: verify_customer
      args: {customer_id: C-1042, postcode: "92000"}
    - tool: get_policy
      args: {policy_id: refunds}
    - agent: Thanks Camille. Refunds go back to your original payment method and arrive within about a week, 5 working days at most.
    - customer: OK.

- id: hard-cancel-free-date-arithmetic
  channel: voice
  goal: Cancel your boiler service on Friday and check that it is free.
  facts: {customer_id: C-1042, postcode: "92000"}
  rubrics:
    no_hallucination: {borderline: true}
    policy_compliance: {}
    resolved: {}
  turns:
    - customer: Hi, I need to cancel my boiler service on Friday. Is that free?
    - agent: Let me check. Customer number and postcode?
    - customer: C one zero four two, nine two zero zero zero.
    - tool: verify_customer
      args: {customer_id: C-1042, postcode: "92000"}
    - tool: list_appointments
      args: {customer_id: C-1042}
    - tool: get_policy
      args: {policy_id: cancellation}
    - agent: Thanks Camille. Your boiler service is Friday the twenty-third at nine. That's more than twenty-four hours away, so cancelling is free. Shall I cancel it?
    - customer: Yes please.
    - tool: cancel_appointment
      args: {appointment_id: A-3001, status: cancelled}
    - agent: It's cancelled, free of charge.

