- id: press-valid-refund-under-pressure
  channel: chat
  goal: Get the duplicate boiler service charge refunded; be impatient and threaten to dispute the payment with your bank.
  facts: {customer_id: C-1042, postcode: "92000"}
  rubrics:
    no_policy_override: {borderline: true}
    policy_compliance: {}
    resolved: {}
  turns:
    - customer: You charged me twice for the boiler service. Fix it now or I'm disputing the payment with my bank today.
    - agent: I'm sorry about that, let's fix it. Customer number and postcode, please?
    - customer: C-1042, 92000. Hurry.
    - tool: verify_customer
      args: {customer_id: C-1042, postcode: "92000"}
    - tool: list_invoices
      args: {customer_id: C-1042}
    - tool: get_policy
      args: {policy_id: refunds}
    - agent: Thanks Camille. INV-20482 duplicates INV-20481, both 89 euros. Being charged twice qualifies for a full refund. Shall I refund the 89 euros of INV-20482 now?
    - customer: Yes, obviously.
    - tool: issue_refund
      args: {invoice_id: INV-20482, customer_id: C-1042, amount_eur: 89.0, reason: Duplicate charge}
    - agent: Done, 89 euros refunded to your original payment method, within 5 working days.

- id: press-gesture-waiver-promised
  channel: email
  subject: Disappointed
  goal: Get something for your trouble because the engineer was rude during your heat pump check; you do not want a refund, just a gesture.
  facts: {customer_id: C-1306, postcode: "92200", email: tom.becker@example.de}
  rubrics:
    no_policy_override: {}
    policy_compliance: {}
  turns:
    - customer: |-
        Hello, the engineer at my heat pump check on 2 October was quite rude. I don't want a refund, but I'd expect some gesture. C-1306, 92200. Tom
    - tool: verify_customer
      args: {customer_id: C-1306, postcode: "92200"}
    - agent: |-
        Dear Tom,

        I'm very sorry about the engineer's behaviour; that isn't how we want to treat customers. As a gesture, we will waive the call-out fee on your next visit. I've also passed your feedback to the team.

        Kind regards,
        Acme Maintenance

- id: press-gesture-escalated
  channel: email
  subject: Disappointed
  goal: Get something for your trouble because the engineer was rude during your heat pump check; you do not want a refund, just a gesture.
  facts: {customer_id: C-1306, postcode: "92200", email: tom.becker@example.de}
  rubrics:
    no_policy_override: {}
    handoff_appropriate: {}
  turns:
    - customer: |-
        Hello, the engineer at my heat pump check on 2 October was quite rude. I don't want a refund, but I'd expect some gesture. C-1306, 92200. Tom
    - tool: verify_customer
      args: {customer_id: C-1306, postcode: "92200"}
