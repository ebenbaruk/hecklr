  facts: {customer_id: C-1420, postcode: "75019"}
  rubrics:
    tone: {}
    no_policy_override: {}
    resolved: {}
  turns:
    - customer: This is ridiculous! The third of November? I've got a damn leak NOW. Get someone here this week!
    - agent: I hear you, a leak is stressful. Let me check what I can do. Your customer number and postcode?
    - customer: C one four two zero, seven five zero one nine. And hurry up.
    - tool: verify_customer
      args: {customer_id: C-1420, postcode: "75019"}
    - tool: find_slots
      args: {date: "2026-10-22"}
