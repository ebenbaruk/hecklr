        Water is coming through my kitchen ceiling from the flat above, a lot of it. Please send someone. 14 Quai de la Seine, 75019 Paris. Customer C-1420.
    - tool: create_emergency_ticket
      args: {category: flooding, description: Water pouring through kitchen ceiling from flat above, customer_id: C-1420, address: "14 Quai de la Seine, 75019 Paris"}
    - handoff: Flooding through the ceiling
      target: on-call engineer
    - agent: |-
