        This is an emergency and I have escalated it immediately: emergency ticket emergency_tickets-1 is open and your case has been handed to our on-call engineer. Please turn off the electricity in the kitchen if you can do so safely, keep away from wet sockets and lights, and if you can, warn your upstairs neighbour so they can turn off their water. For the fastest response, you can also call our emergency line, which is open 24/7.

        Acme Maintenance

