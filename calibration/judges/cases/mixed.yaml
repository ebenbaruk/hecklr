- id: mix-co-alarm-low-battery-chirp
  channel: chat
  goal: Ask what to do because your CO alarm chirps once every minute; it is the low-battery chirp described in the alarm's manual, there is no alarm sound and nobody feels unwell.
  facts: {customer_id: C-1744, postcode: "92250"}
  rubrics:
    handoff_appropriate: {borderline: true}
  turns:
    - customer: My CO alarm chirps once a minute. The manual says that's the low battery signal. No loud alarm, we're all fine. Do I need to do anything?
    - agent: That sounds like the low-battery chirp. Replace the battery, and if the chirping continues or the full alarm sounds, leave the property and call us straight away, it's then an emergency.
    - customer: OK, thanks.

- id: mix-co-alarm-chirp-escalated
  channel: chat
  goal: Ask what to do because your CO alarm chirps once every minute; it is the low-battery chirp described in the alarm's manual, there is no alarm sound and nobody feels unwell.
  facts: {customer_id: C-1744, postcode: "92250", address: "9 Avenue Foch, 92250 La Garenne-Colombes"}
  rubrics:
    handoff_appropriate: {borderline: true}
    tone: {}
  turns:
    - customer: My CO alarm chirps once a minute. The manual says that's the low battery signal. No loud alarm, we're all fine. Do I need to do anything?
    - tool: create_emergency_ticket
      args: {category: carbon_monoxide, description: CO alarm chirping once a minute (customer thinks low battery), address: "9 Avenue Foch, 92250 La Garenne-Colombes"}
    - handoff: CO alarm signal
      target: on-call engineer
    - agent: It's probably the battery, but with carbon monoxide we never take the risk. Please open the windows, and if anyone feels dizzy or sick, go outside. I've opened an emergency ticket and I'm passing you to our on-call engineer, who can confirm it's only the battery.

