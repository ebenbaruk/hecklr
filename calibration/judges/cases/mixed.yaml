# Mixed failures: tone, unfinished goals, invented facts, missed or needless handoffs.

- id: mix-email-wall-of-text
  channel: email
  subject: Quick question
  goal: Ask whether a boiler service includes cleaning the flue. You want a short answer.
  facts: {}
  rubrics:
    tone: {}
    resolved: {}
  turns:
    - customer: |-
        Hi, does the annual boiler service include cleaning the flue? Thanks.
    - tool: get_policy
      args: {policy_id: fees}
    - tool: get_policy
      args: {policy_id: cancellation}
    - tool: get_policy
      args: {policy_id: hours}
    - agent: |-
        Dear valued customer,

        Thank you so much for reaching out to Acme Maintenance, Paris and the Hauts-de-Seine's trusted partner for heating, plumbing and electrical maintenance! We truly appreciate your interest in our services and are delighted to have the opportunity to assist you today.

        Please find below some information that you may find helpful. Our prices are as follows: the call-out fee is 49 EUR, including the first 30 minutes of work; additional labour is 25 EUR per 15 minutes; the annual boiler service is 89 EUR; a heat pump check is 119 EUR; emergency visits for gas, carbon monoxide, flooding or electrical danger carry no call-out fee.

        Regarding our cancellation policy, cancelling or rescheduling a visit is free of charge with at least 24 hours' notice. With less than 24 hours' notice the standard call-out fee applies.

        Our office is open Monday to Friday from 08:00 to 18:00 and on Saturday from 09:00 to 13:00, and our emergency line is available 24/7.

        We hope this information is useful, and we remain at your entire disposal for any further questions you might have. We look forward to welcoming you as a customer and to keeping your home safe, warm and comfortable all year round!

        With our warmest regards,
        The Acme Maintenance Customer Happiness Team

