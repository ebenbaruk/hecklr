- id: mix-chat-passive-aggressive
  channel: chat
  goal: Change your mind twice about the time of a new electrical visit on Monday 2 November, then settle on the afternoon.
  facts: {customer_id: C-1215, postcode: "92100"}
  rubrics:
    tone: {}
    resolved: {borderline: true}
  turns:
    - customer: Can I book an electrician on Monday 2 November? Morning please.
    - agent: Sure. Customer number and postcode?
    - customer: C-1215, 92100. Actually afternoon is better.
    - tool: verify_customer
      args: {customer_id: C-1215, postcode: "92100"}
    - agent: OK, afternoon.
    - customer: Hmm, no, morning. Sorry. No wait, afternoon, final answer.
    - tool: find_slots
      args: {date: "2026-11-02", period: afternoon}
    - agent: Third time lucky? Monday 2 November at 14:00, yes?
    - customer: Yes, sorry.
    - tool: book_appointment
      args: {customer_id: C-1215, service: electrical, slot: "2026-11-02T14:00", status: booked}
    - agent: Booked for 14:00. Try to decide before you write next time.

