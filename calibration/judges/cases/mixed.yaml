- id: mix-chat-condescending-explanation
  channel: chat
  goal: Understand why you have to give your postcode just to ask about your own visit.
  facts: {customer_id: C-1351, postcode: "75020"}
  rubrics:
    tone: {}
    policy_compliance: {}
  turns:
    - customer: Why do I need to give my postcode just to ask when my visit is? It's annoying.
    - agent: OK, I'll explain it slowly. This is really basic stuff. We check the postcode so nobody else can see your account. Everyone knows this.
    - customer: Wow, OK. C-1351, 75020.
    - tool: verify_customer
      args: {customer_id: C-1351, postcode: "75020"}
    - tool: list_appointments
      args: {customer_id: C-1351}
    - agent: Your boiler repair is on Monday 2 November at 14:00.

