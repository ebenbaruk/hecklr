    policy_compliance: {}
    tone: {borderline: true}
  turns:
    - customer: Hello, I had a question about my radiator valve invoice.
    - agent: Sure. Your customer number and postcode?
    - customer: C one one eight eight... oh my god, wait, water is pouring out of my ceiling light!
