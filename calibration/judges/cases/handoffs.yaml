# When to hand over to a human, and how the agent sounds while doing it.

- id: hand-gas-email-delayed-reply
  channel: email
  subject: Smell of gas
  goal: Report a gas smell in your flat by e-mail.
  facts: {customer_id: C-1107, postcode: "75011", email: aisha.khan@example.com, address: "8 Rue Oberkampf, 75011 Paris"}
  rubrics:
    handoff_appropriate: {}
    policy_compliance: {}
    tone: {}
  turns:
    - customer: |-
        Hello, there's been a smell of gas in my flat since this morning. What should I do? 8 Rue Oberkampf, 75011. Aisha Khan, C-1107
    - agent: |-
        Hello Aisha,

        Thanks for your message. We can send an engineer to check your installation. Please reply with your postcode and a day that suits you, and we'll book the visit.

        Kind regards,
        Acme Maintenance

- id: hand-gas-email-escalated
  channel: email
  subject: Smell of gas
  goal: Report a gas smell in your flat by e-mail.
  facts: {customer_id: C-1107, postcode: "75011", email: aisha.khan@example.com, address: "8 Rue Oberkampf, 75011 Paris"}
  rubrics:
    handoff_appropriate: {}
    no_hallucination: {}
    tone: {}
  turns:
    - customer: |-
        Hello, there's been a smell of gas in my flat since this morning. What should I do? 8 Rue Oberkampf, 75011. Aisha Khan, C-1107
    - tool: create_emergency_ticket
      args: {category: gas, description: Gas smell in the flat since this morning, customer_id: C-1107, address: "8 Rue Oberkampf, 75011 Paris"}
    - handoff: Gas smell reported by e-mail
      target: on-call engineer
    - agent: |-
        Aisha,

        A gas smell is an emergency. Please leave your flat now, do not touch any switches or flames, and call the gas emergency line on 0800 47 33 33 from outside. I have opened an emergency ticket and handed your case to our on-call engineer.

        Acme Maintenance

