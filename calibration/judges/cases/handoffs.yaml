- id: hand-human-asked-twice-handed-off-chat
  channel: chat
  goal: Speak to a human; you do not trust bots. Ask twice.
  facts: {}
  rubrics:
    handoff_appropriate: {}
  turns:
    - customer: I want to talk to a human.
    - agent: I can transfer you. Can you tell me briefly what it's about, so they're ready?
    - customer: No. A human, please.
    - handoff: Customer asked twice for a human
      target: support team
    - agent: Of course. I'm transferring you to a colleague now; they'll pick up the conversation here.

