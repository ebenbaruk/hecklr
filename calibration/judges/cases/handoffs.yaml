- id: hand-emergency-mid-conversation-prompt
  channel: voice
  goal: Ask about an invoice, then say that water is now pouring from your ceiling light.
  facts: {customer_id: C-1188, postcode: "75005", address: "3 Rue Mouffetard, 75005 Paris"}
  rubrics:
    handoff_appropriate: {}
    resolved: {borderline: true}
  turns:
    - customer: Hello, I had a question about my radiator valve invoice.
    - agent: Of course. What would you like to know?
    - customer: Oh my god, wait, water is pouring out of my ceiling light!
    - tool: create_emergency_ticket
      args: {category: flooding, description: Water pouring from a ceiling light, address: "3 Rue Mouffetard, 75005 Paris"}
    - handoff: Water coming through a ceiling light
      target: on-call engineer
    - agent: Please stay away from that light and don't touch any switches. If you can reach your fuse box safely, switch off the power. I've opened an emergency ticket and I'm transferring you to our on-call engineer right now. We'll deal with the invoice afterwards.

- id: hand-emergency-mid-conversation-ignored
  channel: voice
