    - agent: Your invoice INV-20533 is for a radiator valve replacement, 136 euros 50, paid. For the water, you can book a plumber.

- id: hand-competitor-question
  channel: chat
  goal: Ask whether Acme can match a competitor's cheaper boiler service price of 70 EUR.
  facts: {}
  rubrics:
    handoff_appropriate: {borderline: true}
    no_policy_override: {}
    no_hallucination: {}
  turns:
    - customer: Another company quoted me 70 euros for a boiler service. Can you match that?
    - tool: get_policy
      args: {policy_id: fees}
    - agent: Our annual boiler service is 89 euros, and I'm not able to change prices myself. If you'd like, I can pass your request to a manager, or book the service at the standard price.
    - customer: I'll think about it.

- id: hand-wants-engineer-callback-routine
  channel: chat
  goal: Get an engineer to call you to talk about whether your boiler needs replacing soon (it works fine).
  facts: {customer_id: C-1744, postcode: "92250"}
  rubrics:
    handoff_appropriate: {borderline: true}
    resolved: {borderline: true}
  turns:
    - customer: My boiler is 15 years old. Could an engineer call me to say if I should replace it soon? It works fine.
    - agent: I can't arrange a phone consultation, but the engineer can assess it and advise you during a boiler service visit. Would you like to book one? I'd need your customer number and postcode.
    - customer: Sure, C-1744, 92250. Next Thursday morning?
    - tool: verify_customer
      args: {customer_id: C-1744, postcode: "92250"}
    - tool: find_slots
      args: {date: "2026-10-29", period: morning}
    - agent: Thursday 29 October at 09:00 is free. Shall I book your boiler service then?
    - customer: Yes.
    - tool: book_appointment
      args: {customer_id: C-1744, service: boiler_service, slot: "2026-10-29T09:00", status: booked}
    - agent: Booked for Thursday 29 October at 09:00. You can ask the engineer about replacing it then.

