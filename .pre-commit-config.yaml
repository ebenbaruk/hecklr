# Lint and type hooks run through `uv run` so they use exactly the versions pinned in uv.lock.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # mkdocs.yml names a Python function (!!python/name:...) for Mermaid fences, which a safe
        # YAML loader rejects; `mkdocs build --strict` in CI validates that file instead.
        exclude: ^mkdocs\.yml$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        # --force-exclude: pre-commit passes file names, which ruff otherwise formats even when
        # pyproject excludes them (ruff must never rewrite docs/SPEC.md's code blocks).
        entry: uv run ruff format --force-exclude
        language: system
        # Markdown too: ruff formats Python code blocks in docs, and CI checks them.
        types_or: [python, pyi, markdown]
      - id: mypy
        name: mypy --strict (every package)
        entry: scripts/mypy-all.sh
        language: system
        types_or: [python, pyi]
        pass_filenames: false
