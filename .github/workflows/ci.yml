name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  FORCE_COLOR: "1"

jobs:
  check:
    name: lint · types · tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install workspace
        run: uv sync --all-packages --all-extras

      - name: Ruff lint
        run: uv run ruff check . --output-format=github

      - name: Ruff format
        run: uv run ruff format --check .

      - name: mypy --strict
        run: scripts/mypy-all.sh

      # SC4 (±20 ms voice timing) is asserted serially on the idle runner; the parallel step
      # below skips these tests, whose timing would measure its other workers (ADR 0010b).
      - name: SC4 voice timing (serial)
        # A shared runner is idle enough for every SC4 case but the in-process WebRTC bots,
        # whose own timing truth wanders by hundreds of ms here (ADR 0010b).
        env:
          HECKLR_SHARED_CPU: "1"
        run: uv run pytest -m sc4_timing -p no:xdist --cov --cov-report=

      - name: Unit tests with coverage
        run: >-
          uv run pytest -n auto
          --cov --cov-append --cov-report=term --cov-report=xml
          --cov-fail-under=85

      - name: End-to-end (FakeLLM)
        run: uv run pytest tests/e2e -m fake
