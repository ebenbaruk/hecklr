name: Fault matrix

# SC8 on the chat reference agent, free tier (docs/milestones/M1.md): the rules-brain agent over
# HTTP, the scripted smoke suite and deterministic graders only. No model is called and no secret
# is needed. It must find no regression in the clean agent against itself (A/A) and a regression
# on each of F1-F6, flagged by the fault's grader. The judge tier (a) and the real-model tier (b)
# cost money and run by hand: scripts/fault-matrix/fault_matrix.py --tier a|b.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - examples/acme-maintenance/**
      - examples/acme-faults/**
      - scripts/fault-matrix/**
      - .github/workflows/fault-matrix.yml

permissions:
  contents: read

concurrency:
  group: fault-matrix-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  free-tier:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install workspace
        run: uv sync --all-packages --all-extras

      - name: Run the free tier (clean, A/A, F1-F6)
        run: uv run python scripts/fault-matrix/fault_matrix.py --tier free --out fault-matrix

      - name: Verdict table
        if: always()
        run: |
          if [ -f fault-matrix/matrix.md ]; then
            cat fault-matrix/matrix.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No verdict table: the matrix did not finish (see the logs artifact)." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the matrix, reports and logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fault-matrix-free
          path: |
            fault-matrix/matrix.*
            fault-matrix/reports/
            fault-matrix/logs/
          retention-days: 30
          if-no-files-found: warn
