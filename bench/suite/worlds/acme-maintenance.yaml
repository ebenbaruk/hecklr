# The acme-maintenance world: the stateful backend the reference agent's tools act on.
#
# "Today" in this world is Wednesday 2026-10-21 (the agent's `today` setting matches it), so every
# booked visit below is more than 24 hours away and cancelling any of them is free (policy
# `cancellation`). Tools are declarative CRUD operations only (ADR 0004): no Python entry points,
# so the sandbox never needs this directory on sys.path.
#
# Slots are not marked unavailable when booked: one CRUD operation per tool cannot also update the
# calendar, and no scenario books the same slot twice.
id: acme-maintenance
description: >-
  Acme Maintenance, a heating, plumbing and electrical maintenance company in Paris and the
  Hauts-de-Seine: customers, visits, the slot calendar, invoices, refunds, policies and emergency
  tickets.
