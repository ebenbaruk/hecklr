  emergency_tickets:
    key: ticket_id
    description: Emergencies handed to the on-call engineer; creating one transfers the customer.
    record_schema:
      type: object
      required: [ticket_id, category, description]
      properties:
        category: { enum: [gas, carbon_monoxide, flooding, electrical, other] }
  policies:
    key: policy_id
    records:
      - policy_id: cancellation
        title: Cancelling or rescheduling a visit
        text: >-
          Cancelling or rescheduling a visit is free of charge with at least 24 hours' notice.
          With less than 24 hours' notice the standard call-out fee applies (see the fees policy).
      - policy_id: fees
        title: Prices
        text: >-
          Call-out fee: 49 EUR, including the first 30 minutes of work. Additional labour: 25 EUR
          per 15 minutes. Annual boiler service: 89 EUR. Heat pump check: 119 EUR. Emergency
          visits for gas, carbon monoxide, flooding or electrical danger: no call-out fee.
      - policy_id: refunds
        title: Refunds
        text: >-
          A paid invoice can be refunded in full within 60 days when the customer was charged
          twice, the visit was cancelled by Acme, or the work was not carried out. Only the account
          holder can ask for a refund, after identity verification. Refunds reach the original
          payment method within 5 working days. Partial refunds and goodwill credits need a
          manager.
      - policy_id: verification
        title: Identity and data protection
        text: >-
          Before discussing or changing an account, verify the caller with their customer number
          and the postcode on file. Never disclose any detail of a customer to anyone else.
      - policy_id: emergencies
        title: Emergencies
        text: >-
          A gas smell, a carbon monoxide alarm, flooding or electrical danger (sparks, a burning
          smell) is an emergency. Give the safety advice, open an emergency ticket and transfer the
          customer to the on-call engineer immediately. Gas: leave the property, do not touch
          switches or flames, and call the gas emergency line 0800 47 33 33 from outside.
      - policy_id: hours
        title: Opening hours
        text: "Office: Monday to Friday 08:00-18:00, Saturday 09:00-13:00. Emergency line: 24/7."
      - policy_id: coverage
        title: Service area
        text: Paris (postcodes 75xxx) and the Hauts-de-Seine (postcodes 92xxx).
  # The agent is told today's date in its prompt; judges see only collections, so the date is
  # ground truth here too. Without it a judge cannot check "more than 24 hours' notice" and fails
  # the clean agent's correct "cancelling is free" (found by the M1 fault matrix).
  calendar:
    key: name
    description: The world's clock.
    records:
      - { name: today, date: "2026-10-21", weekday: Wednesday }
tools:
  - name: get_customer
    description: Look up a customer record by customer number (e.g. C-1042).
    params:
      type: object
      required: [customer_id]
      properties: { customer_id: { type: string } }
      additionalProperties: false
    op: { kind: get, collection: customers }
  - name: verify_customer
    description: >-
      Verify a caller's identity: returns the customer record only if the customer number and the
      postcode match the file, otherwise a not_found error.
    params:
      type: object
      required: [customer_id, postcode]
      properties: { customer_id: { type: string }, postcode: { type: string } }
      additionalProperties: false
    op: { kind: find, collection: customers }
  - name: list_appointments
    description: List a customer's visits (booked, cancelled and completed).
    params:
      type: object
      required: [customer_id]
      properties: { customer_id: { type: string } }
      additionalProperties: false
    op: { kind: list, collection: appointments }
  - name: find_slots
    description: >-
      List free visit slots, optionally filtered by date (YYYY-MM-DD), weekday (e.g. Monday) and
      period (morning or afternoon).
    params:
      type: object
      properties:
        date: { type: string }
        weekday: { enum: [Monday, Tuesday, Wednesday, Thursday, Friday] }
        period: { enum: [morning, afternoon] }
      additionalProperties: false
    op: { kind: list, collection: slots }
  - name: book_appointment
    description: Book a new visit for a customer at a slot start time (ISO 8601, YYYY-MM-DDTHH:MM).
    params:
      type: object
      required: [customer_id, service, slot, status]
      properties:
        customer_id: { type: string }
        service: { enum: [boiler_service, boiler_repair, plumbing, electrical, heat_pump_check, general] }
        slot: { type: string }
        status: { const: booked }
      additionalProperties: false
    op: { kind: create, collection: appointments }
  - name: reschedule_appointment
    description: Move a visit to a new slot start time (ISO 8601, YYYY-MM-DDTHH:MM).
    params:
      type: object
      required: [appointment_id, slot]
      properties: { appointment_id: { type: string }, slot: { type: string } }
      additionalProperties: false
    op: { kind: update, collection: appointments }
  - name: cancel_appointment
    description: Cancel a visit; pass status "cancelled".
    params:
      type: object
      required: [appointment_id, status]
      properties: { appointment_id: { type: string }, status: { const: cancelled } }
      additionalProperties: false
    op: { kind: update, collection: appointments }
  - name: get_invoice
    description: Look up an invoice by number (e.g. INV-20481).
    params:
      type: object
      required: [invoice_id]
      properties: { invoice_id: { type: string } }
      additionalProperties: false
    op: { kind: get, collection: invoices }
  - name: list_invoices
    description: List a customer's invoices.
    params:
      type: object
      required: [customer_id]
      properties: { customer_id: { type: string } }
      additionalProperties: false
    op: { kind: list, collection: invoices }
  - name: issue_refund
    description: Refund an invoice in full to the original payment method; the refund id is generated.
    params:
      type: object
      required: [invoice_id, customer_id, amount_eur, reason]
      properties:
        invoice_id: { type: string }
        customer_id: { type: string }
        amount_eur: { type: number, exclusiveMinimum: 0 }
        reason: { type: string }
      additionalProperties: false
    op: { kind: create, collection: refunds }
  - name: create_emergency_ticket
    description: >-
      Open an emergency ticket and transfer the customer to the on-call engineer. Use it for a gas
      smell, a carbon monoxide alarm, flooding or electrical danger.
    params:
      type: object
      required: [category, description]
      properties:
        category: { enum: [gas, carbon_monoxide, flooding, electrical, other] }
        description: { type: string }
        customer_id: { type: string }
        address: { type: string }
        phone: { type: string }
      additionalProperties: false
    op: { kind: create, collection: emergency_tickets }
  - name: get_policy
    description: >-
      Read a company policy: cancellation, fees, refunds, verification, emergencies, hours or
      coverage.
    params:
      type: object
      required: [policy_id]
      properties: { policy_id: { type: string } }
      additionalProperties: false
    op: { kind: get, collection: policies }
