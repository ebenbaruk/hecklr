id: pipecat-cloud
name: Pipecat 1.13, AssemblyAI + OpenAI TTS
track: voice
description: >-
  The same Pipecat 1.13 pipeline with cloud speech: AssemblyAI Universal-Streaming (one streaming
  session per call, endpoint forced by Pipecat's VAD) and OpenAI gpt-4o-mini-tts, voice alloy.
why: >-
  The common hosted-speech setup: does streaming recognition shorten the response path, how much
  does a network TTS add before the first audio frame, and what a call costs.
components:
  transport: SmallWebRTC (WebRTC, Opus)
  vad: Silero + smart-turn v3 (Pipecat defaults)
  asr: AssemblyAI universal-streaming (cloud)
  brain: acme rules
  tts: OpenAI gpt-4o-mini-tts alloy (cloud)
command: ["{python}", "{repo}/bench/stacks/agents/pipecat_acme.py", "--stt", "assemblyai", "--tts", "openai", "--budget-usd", "{agent_budget_usd}", "--port", "{port}"]
env: { ACME_SEED: "{seed}" }
ready: { http: "http://127.0.0.1:{port}/healthz", timeout_s: 300 }
adapter: { type: pipecat, url: "http://127.0.0.1:{port}/api/offer" }
spend_url: "http://127.0.0.1:{port}/healthz"
requires_env: [OPENAI_API_KEY, ASSEMBLYAI_API_KEY]
budget_usd: 0.03
# Metered by the agent at list price (18 calls of about 40 s: about $0.03 of AssemblyAI and at
# most $0.10 of speech); past the cap it refuses new calls.
agent_budget_usd: 0.15
