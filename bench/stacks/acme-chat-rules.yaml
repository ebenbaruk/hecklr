id: acme-chat-rules
name: Acme chat, rules brain
track: chat
description: >-
  The acme-maintenance reference agent over HTTP with server-sent events, answering with its
  deterministic keyword brain and calling the trial's world tools.
why: >-
  The floor for chat: no model, no cost, exactly repeatable. An LLM stack should beat it on task
  success; where it does not, the scenarios reward keyword matching over understanding.
components:
  transport: HTTP + SSE
  brain: rules (keyword NLU, one task at a time)
command: ["{python}", "{repo}/examples/acme-maintenance/agent/serve.py", "--brain", "rules", "--port", "{port}"]
env: { ACME_SEED: "{seed}" }
ready: { http: "http://127.0.0.1:{port}/healthz", timeout_s: 120 }
adapter: { type: http, url: "http://127.0.0.1:{port}/chat/stream", stream: sse, timeout_s: 180 }
spend_url: "http://127.0.0.1:{port}/healthz"
# The guided customers and the judges run on local Ollama (bench.yaml).
budget_usd: 0
