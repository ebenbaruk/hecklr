id: email-booking-1
title: Email booking for C-1802
channels: [email]
tags: [scripted, email, catches-f11]
persona: busy-homeowner
world: acme-maintenance
mode: scripted
goal: Book a boiler service visit by email
facts: {customer_id: C-1802, postcode: '75006'}
user_turns:
- I'd like to book a boiler service on Wednesday 28 October in the afternoon.
- C-1802 75006
- 'Yes'
success:
- {type: email_threading}
