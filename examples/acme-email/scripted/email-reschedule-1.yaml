id: email-reschedule-1
title: Email reschedule of a boiler visit
channels: [email]
tags: [scripted, email, catches-f11]
persona: polite-professional
world: acme-maintenance
mode: scripted
goal: Move the boiler visit on Friday to next week, mornings only
facts: {customer_id: C-1042, postcode: '92000', appointment_id: A-3001}
user_turns:
- Hi, I need to move my boiler visit on Friday to next week, mornings only please.
- C-1042, postcode 92000
- Yes please
success:
- {type: email_threading}
- type: state
  expr: "world.appointments['A-3001'].slot >= '2026-10-26' and world.appointments['A-3001'].slot < '2026-10-31' and world.appointments['A-3001'].slot.hour < 12"
  description: the visit moved to the slot asked for
limits: {max_turns: 12, max_duration_s: 300}
