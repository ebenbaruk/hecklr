# Hecklr configuration for the acme email agent over the webhook adapter.
#
# Start the agent first (its tools go to each trial's world sandbox, see README.md):
#   uv run python examples/acme-email/agent/serve.py --brain rules webhook --port 8100
# The same suites over a real mailbox (SMTP + IMAP): hecklr.mailbox.yaml.
version: 1
agent:
  name: acme-email
  adapters:
    # Hecklr POSTs each customer email to `url` and listens on `listen_port` for the agent's
    # replies. `timeout_s` is also the reply deadline: an agent that stays silent this long (F12)
    # fails the trial with a timeout. It must exceed the agent's tool deadline (mailer.yaml, 5 s)
    # times the LLM brain's retries of a timed-out tool (measured on luna: over 45 s).
    email: { type: webhook, url: "http://127.0.0.1:8100/email", listen_port: 8787, timeout_s: 120 }
  # The brain is the chat agent's; the fixer edits its files there.
  editable: [../acme-maintenance/prompts/system.md, ../acme-maintenance/tools/descriptions.yaml]
world: ../acme-maintenance/worlds/acme-maintenance.yaml
suites:
  # Guided customers (luna) and judges; every fault area has at least 6 core scenarios.
  ci: { scenarios: "scenarios/**/*.yaml", tags: [core], trials: 3, channels: [email] }
  full: { scenarios: "scenarios/**/*.yaml", trials: 5, channels: [email] }
  # Scripted customers and deterministic graders only: with the rules brain, a free and exactly
  # repeatable F11/F12 matrix (no model is called).
  smoke: { scenarios: "scripted/*.yaml", trials: 1, channels: [email] }
models:
  simulator: openai/gpt-6-luna
  judge: openai/gpt-6-luna
stats: { alpha: 0.05, min_effect: 0.03 }
budget: { usd: 2, concurrency: 4 }
baseline: { store: local, branch: main }
seed: 20261022
