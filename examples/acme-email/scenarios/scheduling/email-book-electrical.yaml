id: email-book-electrical
title: Customer books an electrician by email
channels: [email]
tags: [email, core, catches-f11, booking]
persona: polite-professional
world: acme-maintenance
goal: "Book an electrician for a tripping fuse on Friday 6 November in the afternoon."
facts:
  customer_id: C-1609
  postcode: '92300'
  preferred_time: Friday 6 November, afternoon
success:
- {type: email_threading}
- type: state
  expr: "any(a.customer_id == 'C-1609' and a.service == 'electrical' and a.status == 'booked' and a.slot == '2026-11-06T14:00' for a in values(world.appointments))"
  description: a visit is booked at the time the customer asked for
- {type: judge, rubric: resolved}
limits: {max_turns: 16, max_duration_s: 600}
