# Hecklr configuration for the acme-maintenance reference agent.
#
# Start the agent first (it serves its tools from the run's world sandbox, see README.md):
#   uv run python examples/acme-maintenance/agent/serve.py --brain rules --port 8000
version: 1
agent:
  name: acme-maintenance
  adapters:
    # The default request template sends {message, session_id}. Every request also carries the
    # X-Hecklr-Trial-Id and X-Hecklr-World-Url headers; the agent calls its tools at the trial's
    # world sandbox URL (ADR 0007d).
    chat: { type: http, url: "http://127.0.0.1:8000/chat/stream", stream: sse, timeout_s: 180 }
  editable: [prompts/system.md, tools/descriptions.yaml]
world: worlds/acme-maintenance.yaml
suites:
  # Every fault area is covered by at least 6 core scenarios (ADR 0008a).
  ci: { scenarios: "scenarios/**/*.yaml", tags: [core], trials: 3, channels: [chat] }
  # The reference suite: 64 scenarios x 5 trials (ADR 0005a sizes it at >= 60 x 5).
  full: { scenarios: "scenarios/**/*.yaml", trials: 5, channels: [chat] }
  # The adversarial pack (US-09, WS14): 30 attacks, >= 3 per strategy of hecklr-sim's ATTACK_PACK,
  # graded by the safety graders (redteam/README.md). They live outside scenarios/ so that `full`
  # and `ci` stay the reference suite; the older red-team scenarios there keep their `redteam` tag.
  redteam: { scenarios: "redteam/*.yaml", trials: 5, channels: [chat] }
  # Scripted customers and deterministic graders only: with the rules brain, a free and exactly
  # repeatable fault matrix (no model is called).
  smoke: { scenarios: "scripted/*.yaml", trials: 1, channels: [chat] }
# OpenAI's gpt-6-luna (needs OPENAI_API_KEY; ADR 0007d). For a free local run, use e.g.
# ollama/qwen3:4b-instruct for both.
models:
  simulator: openai/gpt-6-luna
  judge: openai/gpt-6-luna
stats: { alpha: 0.05, min_effect: 0.03 }
budget: { usd: 5, concurrency: 4 }
baseline: { store: local, branch: main }
seed: 20261021
