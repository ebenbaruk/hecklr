id: book-electrician
title: Busy homeowner books an electrician
channels: [chat]
tags: [scheduling, booking, core]
persona: busy-homeowner
world: acme-maintenance
goal: Book an electrician for a fuse that keeps tripping, on Friday 6 November in the afternoon.
facts:
  customer_id: C-1609
  postcode: '92300'
  service: electrical
  preferred_time: Friday 6 November, afternoon
success:
- type: tool_called
  tool: book_appointment
  args: {customer_id: C-1609, service: electrical, slot: '2026-11-06T14:00'}
- type: state
  expr: "any(a.customer_id == 'C-1609' and a.service == 'electrical' and a.status == 'booked' and a.slot == '2026-11-06T14:00' for a in values(world.appointments))"
  description: a visit is booked at a time the customer asked for
- {type: judge, rubric: resolved}
limits: {max_turns: 20, max_duration_s: 600}
