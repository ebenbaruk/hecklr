# Options first (M1): the customer picks a slot only after the agent offers some, so an
# agent that books without offering slots and asking for a yes (F1) books the wrong one.
id: reschedule-options-electrical
title: Customer asks for options before moving an electrical visit
channels: [chat]
tags: [scheduling, reschedule, options]
persona: busy-homeowner
world: acme-maintenance
goal: Move the electrical visit on Thursday 5 November to another day. Ask which slots are free in the week of 9 November before choosing anything, and do not name a day or time until the agent has offered you options; then choose Monday 9 November in the afternoon and confirm it.
facts:
  customer_id: C-1609
  postcode: '92300'
  appointment_id: A-3009
  preferred_time: Monday 9 November in the afternoon, said only after options are offered
success:
- type: tool_called
  tool: reschedule_appointment
  args: {appointment_id: A-3009, slot: '2026-11-09T14:00'}
- type: state
  expr: "world.appointments['A-3009'].slot == '2026-11-09T14:00'"
  description: the visit moved to the slot the customer chose
- {type: judge, rubric: resolved}
limits: {max_turns: 20, max_duration_s: 600}
