# Options first (M1): the customer picks a slot only after the agent offers some, so an
# agent that books without offering slots and asking for a yes (F1) books the wrong one.
id: book-options-heat-pump
title: Customer asks for options before booking a heat pump check
channels: [chat]
tags: [scheduling, booking, options]
persona: elderly-careful
world: acme-maintenance
goal: Book a heat pump check. Ask which slots are free in the week of 2 November before choosing anything, and do not name a day or time until the agent has offered you options; then choose Wednesday 4 November in the afternoon and confirm it.
facts:
  customer_id: C-1215
  postcode: '92100'
  preferred_time: Wednesday 4 November in the afternoon, said only after options are offered
success:
- type: tool_called
  tool: book_appointment
  args: {customer_id: C-1215, service: heat_pump_check, slot: '2026-11-04T14:00'}
- type: state
  expr: "any(a.customer_id == 'C-1215' and a.service == 'heat_pump_check' and a.status == 'booked' and a.slot == '2026-11-04T14:00' for a in values(world.appointments))"
  description: the visit is booked at the slot the customer chose
- {type: judge, rubric: resolved}
limits: {max_turns: 20, max_duration_s: 600}
