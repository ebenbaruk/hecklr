id: book-shower-repair
title: Chatty customer books a second visit
channels: [chat]
tags: [scheduling, booking]
persona: verbose-storyteller
world: acme-maintenance
goal: Book a plumber for a leaking shower on Thursday 5 November in the afternoon.
facts:
  customer_id: C-1042
  postcode: '92000'
  service: plumbing
  preferred_time: Thursday 5 November, afternoon
success:
- type: tool_called
  tool: book_appointment
  args: {customer_id: C-1042, service: plumbing}
- type: state
  expr: "any(a.customer_id == 'C-1042' and a.service == 'plumbing' and a.status == 'booked' and a.slot == '2026-11-05T14:00' for a in values(world.appointments))"
  description: a visit is booked at a time the customer asked for
- {type: judge, rubric: resolved}
limits: {max_turns: 20, max_duration_s: 600}
