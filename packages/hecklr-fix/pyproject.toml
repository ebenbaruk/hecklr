[project]
name = "hecklr-fix"
version = "0.1.0"
description = "Hecklr fixer: candidate prompt patches validated against the suite."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Eli Benbaruk" }]
dependencies = [
    "hecklr-schemas",
    "hecklr-llm",
    "hecklr-core",
    "hecklr-grade",
    "hecklr-mine",
    "hecklr-report",
    "hecklr-sim",
    "hecklr-stats",
    "anyio>=4.10",
    "pydantic>=2.11",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hecklr_fix"]
