[project]
name = "hecklr-sim"
version = "0.1.0"
description = "Hecklr simulated customer: scripted, guided, replay and adversarial modes."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Eli Benbaruk" }]
dependencies = [
    "hecklr-schemas>=0.1,<0.2",
    "hecklr-llm>=0.1,<0.2",
    "anyio>=4.10",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hecklr_sim"]
