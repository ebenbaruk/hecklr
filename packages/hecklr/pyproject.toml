[project]
name = "hecklr"
version = "0.1.0"
description = "The crash-test lab for conversational AI agents: simulated customers over voice, chat and email, with statistical verdicts."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Eli Benbaruk" }]
keywords = ["llm", "agents", "evaluation", "voice", "testing", "ci"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
# The default install is text-only (chat + email). Audio and mining pull heavy native
# dependencies, so they live behind extras.
dependencies = [
    "hecklr-schemas",
    "hecklr-llm",
    "hecklr-core",
    "hecklr-sim",
    "hecklr-world",
    "hecklr-channels",
    "hecklr-adapters",
    "hecklr-grade",
    "hecklr-stats",
    "hecklr-report",
    "hecklr-fix",
    "anyio>=4.10",
    "httpx2>=2.12",
    "pydantic>=2.11",
    "rich>=14.0",
    "typer>=0.20",
]

[project.optional-dependencies]
voice = ["hecklr-voice"]
local-voice = ["hecklr-voice[local]"]
mine = ["hecklr-mine"]
# The UI server; the built React app ships inside the wheel (ADR 0016a).
ui = ["fastapi>=0.156,<1", "uvicorn>=0.54,<1"]
all = ["hecklr[voice,local-voice,mine,ui]"]

[project.scripts]
hecklr = "hecklr.cli:main"

# Loaded by pytest everywhere Hecklr is installed, but inert without --hecklr-suite.
[project.entry-points.pytest11]
hecklr = "hecklr.pytest_plugin"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hecklr"]
# Built by `npm run build` in ui/ and git-ignored, so it must be named to be packaged.
artifacts = ["src/hecklr/ui_api/static/**"]
