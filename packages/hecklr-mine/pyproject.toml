[project]
name = "hecklr-mine"
version = "0.1.0"
description = "Hecklr miner: log ingestion, PII scrubbing, failure clustering, scenario synthesis."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Eli Benbaruk" }]
dependencies = [
    "hecklr-schemas",
    "hecklr-llm",
    "hecklr-sim",
    "hecklr-grade",
    "numpy>=2.3",
    "scikit-learn>=1.7",
    "pyyaml>=6.0",
    "anyio>=4.10",
    "openai>=3.35,<4",
    "structlog>=25.4",
]

[project.optional-dependencies]
presidio = [
    "presidio-analyzer>=2.2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hecklr_mine"]
