[project]
name = "hecklr-voice"
version = "0.1.0"
description = "Hecklr voice engine: audio pipeline, impairments, turn-taking, voice metrics."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Eli Benbaruk" }]
dependencies = [
    "anyio>=4.10",
    "hecklr-adapters",
    "hecklr-schemas",
    "httpx2>=2.16",
    "numpy>=2.3",
    "scipy>=1.16",
]

[project.optional-dependencies]
# Local models, downloaded on first use under .hecklr/models: Kokoro TTS (kokoro-onnx),
# faster-whisper ASR and Silero VAD (onnxruntime).
local = [
    "faster-whisper>=1.2",
    "kokoro-onnx>=0.4",
    "onnxruntime>=1.22",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hecklr_voice"]

[dependency-groups]
dev = [
    "hecklr-grade",
    "hecklr-llm",
    "hecklr-sim",
    "scipy-stubs>=1.18.1.1",
]
