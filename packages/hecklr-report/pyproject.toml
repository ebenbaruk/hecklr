[project]
name = "hecklr-report"
version = "0.1.0"
description = "Hecklr reports: terminal, Markdown, HTML, JSON and JUnit."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Eli Benbaruk" }]
dependencies = [
    "hecklr-schemas",
    "hecklr-core",
    "hecklr-grade",
    "hecklr-stats",
    "jinja2>=3.1.6",
    "numpy>=2.3",
    "rich>=14.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hecklr_report"]
