[project]
name = "hecklr-adapters"
version = "0.1.0"
description = "Hecklr target adapters and the shared adapter contract test suite."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Eli Benbaruk" }]
dependencies = [
    "anyio>=4.10",
    "hecklr-schemas",
    "httpx2>=2.16",
    "numpy>=2.3",
    "websockets>=15",
]

[project.optional-dependencies]
# Voice transports beyond WebSocket: `pipecat` reaches a Pipecat SmallWebRTC endpoint through
# aiortc, `livekit` joins a LiveKit room with the rtc SDK and signs its own access tokens.
pipecat = ["aiortc>=1.15"]
livekit = ["livekit>=1.1.21", "livekit-api>=1.1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hecklr_adapters"]

[dependency-groups]
dev = [
    "fastapi>=0.156.8",
    "hecklr-voice",
    "pipecat-ai[webrtc,websocket]>=1.13",
    "uvicorn>=0.54.0",
]
