[project]
name = "hecklr-adapters"
version = "0.1.0"
description = "Hecklr target adapters and the shared adapter contract test suite."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Eli Benbaruk" }]
dependencies = [
    "anyio>=4.10",
    "hecklr-schemas",
    "httpx2>=2.16",
    "websockets>=15",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hecklr_adapters"]

[dependency-groups]
dev = [
    "fastapi>=0.156.8",
    "uvicorn>=0.54.0",
]
