[project]
name = "hecklr-adapters"
version = "0.1.0"
description = "Hecklr target adapters and the shared adapter contract test suite."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Eli Benbaruk" }]
dependencies = [
    "hecklr-schemas",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hecklr_adapters"]
