[project]
name = "hecklr-channels"
version = "0.1.0"
description = "Hecklr channel drivers for chat and email conversations."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Eli Benbaruk" }]
dependencies = [
    "anyio>=4.10",
    "hecklr-adapters",
    "hecklr-schemas",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hecklr_channels"]

[dependency-groups]
dev = [
    "fastapi>=0.156.8",
    "hecklr-llm",
    "uvicorn>=0.54.0",
]
